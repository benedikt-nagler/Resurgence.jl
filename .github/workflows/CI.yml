name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite is expensive: 54.6 min on ubuntu / 39.6 min on macOS for the full 825
    # tests (cold cache, CairoMakie precompilation + BigFloat numerics). 60 min left
    # almost no headroom, so allow well over the observed worst case.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Version coverage on Linux; one job each on macOS and Windows to catch
      # platform-specific breakage without paying for the full 3x3 grid.
      matrix:
        version:
          - "1.10"   # LTS
          - "1"      # latest stable
          - "nightly"
        os:
          - ubuntu-latest
        include:
          - version: "1"
            os: macos-latest
          - version: "1"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
